<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>운석이 떨어진다!!!! - 기획: 정현서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 초등학생 취향에 맞는 둥글고 역동적인 한글 폰트 (Jua, Black Han Sans) -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Jua', sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .title-font {
            font-family: 'Black Han Sans', sans-serif;
            letter-spacing: -0.02em;
        }
        /* 아케이드 스타일 3D 입체 버튼 */
        .arcade-btn {
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.4), 0 8px 15px rgba(0, 0, 0, 0.3);
        }
        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        /* 캐릭터 선택 카드 활성화 효과 */
        .char-card {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid transparent;
        }
        .char-card.selected-p1 {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
        .char-card.selected-p2 {
            border-color: #fb7185;
            background: rgba(251, 113, 133, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(251, 113, 133, 0.5);
        }
        /* 제목 흔들림 애니메이션 */
        @keyframes titleBounce {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
        }
        .animate-title {
            animation: titleBounce 2s infinite ease-in-out;
        }
        /* 터치 컨트롤 버튼 스타일 */
        .touch-pad-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        }
        .touch-pad-btn:active, .touch-pad-btn.active {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="relative">

    <!-- 상단 헤더 & 점수판 (항상 표시되거나 게임 중 강조) -->
    <header class="w-full max-w-4xl mx-auto px-3 pt-2 pb-1 flex items-center justify-between z-20 shrink-0">
        <!-- 좌측: 기획자 뱃지 & 홈 버튼 -->
        <div class="flex items-center gap-2">
            <button id="homeBtn" onclick="goToMenu()" class="hidden arcade-btn bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-sm sm:text-base flex items-center gap-1 border border-slate-500">
                <span>🏠</span> <span class="hidden sm:inline">메뉴</span>
            </button>
            <div class="bg-indigo-950/80 border border-indigo-500/40 px-3 py-1 rounded-full text-xs sm:text-sm text-indigo-200 flex items-center gap-1.5 shadow-inner">
                <span>💡</span>
                <span>기획: <strong class="text-yellow-300">정현서</strong></span>
            </div>
        </div>

        <!-- 중앙: 실시간 점수판 (게임 중에만 활성화) -->
        <div id="hudScoreBoard" class="hidden flex items-center gap-3 sm:gap-6 bg-slate-900/90 border-2 border-yellow-400/60 px-4 py-1 rounded-2xl shadow-lg">
            <!-- 1인용 모드 점수 -->
            <div id="singleScoreHud" class="flex items-center gap-4">
                <div class="text-center">
                    <span class="text-[10px] sm:text-xs text-slate-400 block leading-none">현재 점수</span>
                    <span id="currentScoreText" class="text-xl sm:text-2xl text-yellow-300 font-bold tracking-wider">0</span>
                </div>
                <div class="h-6 w-[1px] bg-slate-700"></div>
                <div class="text-center">
                    <span class="text-[10px] sm:text-xs text-slate-400 block leading-none">최고 기록</span>
                    <span id="bestScoreText" class="text-lg sm:text-xl text-amber-500 font-bold">0</span>
                </div>
            </div>

            <!-- 2인용 대전 모드 점수 및 생존 상태 -->
            <div id="versusScoreHud" class="hidden flex items-center gap-3 sm:gap-5">
                <div class="flex items-center gap-1.5">
                    <span class="bg-sky-500 text-slate-950 text-xs font-bold px-1.5 py-0.5 rounded">1P</span>
                    <span id="p1StatusText" class="text-sm sm:text-base text-sky-300 font-bold">생존!</span>
                </div>
                <div class="text-center px-2 border-x border-slate-700">
                    <span class="text-[10px] text-slate-400 block leading-none">피한 별</span>
                    <span id="versusScoreText" class="text-lg sm:text-xl text-yellow-300 font-bold">0</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span id="p2StatusText" class="text-sm sm:text-base text-rose-300 font-bold">생존!</span>
                    <span class="bg-rose-500 text-white text-xs font-bold px-1.5 py-0.5 rounded">2P</span>
                </div>
            </div>
        </div>

        <!-- 우측: 사운드 음소거 토글 버튼 -->
        <button id="muteBtn" onclick="toggleMute()" class="arcade-btn bg-indigo-800 hover:bg-indigo-700 text-white p-2 rounded-xl border border-indigo-500 text-base sm:text-lg" title="소리 켜기/끄기">
            🔊
        </button>
    </header>

    <!-- 메인 게임 컨테이너 (캔버스 + 오버레이 메뉴) -->
    <main class="relative flex-1 w-full max-w-4xl mx-auto my-1 px-2 sm:px-4 flex flex-col overflow-hidden">
        <div id="canvasWrapper" class="relative w-full h-full rounded-3xl overflow-hidden border-4 border-indigo-500/50 shadow-[0_0_30px_rgba(79,70,229,0.4)] bg-slate-950">
            
            <!-- 게임 캔버스 -->
            <canvas id="gameCanvas"></canvas>

            <!-- 1. 시작 화면 오버레이 (모드 선택 + 캐릭터 선택) -->
            <div id="startScreen" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-between p-4 sm:p-6 overflow-y-auto z-10">
                
                <!-- 게임 타이틀 -->
                <div class="text-center mt-1 sm:mt-2">
                    <div class="inline-block bg-yellow-400/20 border border-yellow-400/50 text-yellow-300 text-xs sm:text-sm px-3 py-0.5 rounded-full mb-1">
                        ⭐ 하늘에서 떨어지는 별을 피해라! ⭐
                    </div>
                    <h1 class="title-font text-4xl sm:text-6xl text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 via-orange-400 to-red-500 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] animate-title">
                        운석이 떨어진다!!!!
                    </h1>
                </div>

                <!-- 모드 선택 탭 (일반 모드 vs 대전 모드) -->
                <div class="w-full max-w-md my-2">
                    <p class="text-center text-indigo-200 text-sm mb-1.5">🎮 게임 모드를 고르세요</p>
                    <div class="grid grid-cols-2 gap-3 bg-slate-900 p-1.5 rounded-2xl border border-slate-700">
                        <button id="modeSingleBtn" onclick="selectMode('single')" class="arcade-btn py-2.5 px-3 rounded-xl text-base sm:text-lg font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white">
                            <span>👤</span> 일반 모드 (1인)
                        </button>
                        <button id="modeVersusBtn" onclick="selectMode('versus')" class="arcade-btn py-2.5 px-3 rounded-xl text-base sm:text-lg font-bold flex items-center justify-center gap-2 bg-slate-800 text-slate-300 hover:bg-slate-700">
                            <span>⚔️</span> 대전 모드 (2인)
                        </button>
                    </div>
                </div>

                <!-- 캐릭터 선택 영역 -->
                <div class="w-full max-w-2xl my-1 flex-1 flex flex-col justify-center">
                    <!-- 1P 캐릭터 선택 -->
                    <div class="mb-3">
                        <div class="flex items-center justify-between mb-1.5 px-1">
                            <span id="p1SelectLabel" class="text-sm sm:text-base text-sky-300 font-bold flex items-center gap-1.5">
                                <span class="bg-sky-500 text-slate-950 text-xs px-2 py-0.5 rounded-md">1P</span> 캐릭터 선택
                            </span>
                            <span class="text-xs text-slate-400">조작: ◀ ▶ 방향키 또는 A / D</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2.5 sm:gap-4" id="p1CharGrid">
                            <!-- JS로 캐릭터 카드 렌더링 -->
                        </div>
                    </div>

                    <!-- 2P 캐릭터 선택 (대전 모드일 때만 표시) -->
                    <div id="p2SelectSection" class="hidden mt-1 pt-2 border-t border-slate-800">
                        <div class="flex items-center justify-between mb-1.5 px-1">
                            <span class="text-sm sm:text-base text-rose-300 font-bold flex items-center gap-1.5">
                                <span class="bg-rose-500 text-white text-xs px-2 py-0.5 rounded-md">2P</span> 캐릭터 선택
                            </span>
                            <span class="text-xs text-slate-400">1P: A / D 키 &nbsp;|&nbsp; 2P: ◀ / ▶ 키</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2.5 sm:gap-4" id="p2CharGrid">
                            <!-- JS로 2P 캐릭터 카드 렌더링 -->
                        </div>
                    </div>
                </div>

                <!-- 게임 시작 버튼 -->
                <div class="w-full max-w-md mt-2 mb-1">
                    <button onclick="startGame()" class="arcade-btn w-full py-3.5 sm:py-4 rounded-2xl bg-gradient-to-b from-yellow-400 to-orange-500 hover:from-yellow-300 hover:to-orange-400 text-slate-950 title-font text-2xl sm:text-3xl tracking-wide flex items-center justify-center gap-2 border-2 border-yellow-200">
                        <span>🚀</span> 게임 시작!
                    </button>
                </div>
            </div>

            <!-- 2. 게임 오버 / 결과 화면 오버레이 -->
            <div id="gameOverScreen" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="bg-slate-900/95 border-4 border-indigo-500/60 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl transform transition-all">
                    <div id="resultBadge" class="inline-block bg-red-500/20 border border-red-400 text-red-300 px-4 py-1 rounded-full text-sm mb-2">
                        💥 별에 부딪혔어요!
                    </div>
                    <h2 id="resultTitle" class="title-font text-4xl sm:text-5xl text-white mb-4">
                        게임 오버!
                    </h2>

                    <!-- 점수 요약 박스 -->
                    <div id="singleResultBox" class="bg-slate-950 rounded-2xl p-4 mb-5 border border-slate-800 flex justify-around items-center">
                        <div>
                            <p class="text-slate-400 text-sm">이번 점수</p>
                            <p id="finalScoreText" class="text-3xl sm:text-4xl text-yellow-400 font-bold">0</p>
                        </div>
                        <div class="h-10 w-[1px] bg-slate-800"></div>
                        <div>
                            <p class="text-slate-400 text-sm">최고 점수</p>
                            <p id="finalBestText" class="text-2xl sm:text-3xl text-amber-500 font-bold">0</p>
                        </div>
                    </div>

                    <!-- 대전 모드 승자 요약 박스 -->
                    <div id="versusResultBox" class="hidden bg-slate-950 rounded-2xl p-4 mb-5 border border-slate-800">
                        <p id="winnerAnnouncement" class="text-2xl sm:text-3xl font-bold text-yellow-300 mb-1">1P 승리! 🎉</p>
                        <p id="versusSurviveDetail" class="text-sm text-slate-300">총 0개의 별을 피했습니다!</p>
                    </div>

                    <!-- 기획자 크레딧 -->
                    <p class="text-xs text-indigo-300/80 mb-5">
                        ✨ 게임 기획: <span class="text-yellow-300 font-bold">정현서</span> 어린이 ✨
                    </p>

                    <!-- 액션 버튼 -->
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="startGame()" class="arcade-btn py-3 px-4 rounded-2xl bg-gradient-to-b from-emerald-400 to-green-600 text-slate-950 font-bold text-lg sm:text-xl flex items-center justify-center gap-1.5">
                            <span>🔄</span> 다시 하기
                        </button>
                        <button onclick="goToMenu()" class="arcade-btn py-3 px-4 rounded-2xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-lg sm:text-xl flex items-center justify-center gap-1.5 border border-slate-500">
                            <span>🎨</span> 캐릭터/모드
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 하단 모바일/태블릿 터치 컨트롤 패드 (게임 플레이 중에만 표시) -->
    <footer id="touchControls" class="hidden w-full max-w-4xl mx-auto px-3 pb-3 pt-1 shrink-0 z-20">
        <!-- 1인용 터치 컨트롤 -->
        <div id="singleTouchPad" class="grid grid-cols-2 gap-4 h-16 sm:h-20">
            <button id="btnSingleLeft" class="touch-pad-btn rounded-2xl flex items-center justify-center text-3xl text-white active:scale-95">
                ◀ 왼쪽
            </button>
            <button id="btnSingleRight" class="touch-pad-btn rounded-2xl flex items-center justify-center text-3xl text-white active:scale-95">
                오른쪽 ▶
            </button>
        </div>

        <!-- 2인용 대전 터치 컨트롤 (좌측 1P, 우측 2P) -->
        <div id="versusTouchPad" class="hidden grid grid-cols-2 gap-3 sm:gap-6 h-16 sm:h-20">
            <!-- 1P 패드 -->
            <div class="grid grid-cols-2 gap-1.5 bg-sky-950/50 p-1.5 rounded-2xl border border-sky-500/40">
                <button id="btnP1Left" class="touch-pad-btn rounded-xl flex items-center justify-center text-xl sm:text-2xl text-sky-200 font-bold">
                    1P ◀
                </button>
                <button id="btnP1Right" class="touch-pad-btn rounded-xl flex items-center justify-center text-xl sm:text-2xl text-sky-200 font-bold">
                    1P ▶
                </button>
            </div>
            <!-- 2P 패드 -->
            <div class="grid grid-cols-2 gap-1.5 bg-rose-950/50 p-1.5 rounded-2xl border border-rose-500/40">
                <button id="btnP2Left" class="touch-pad-btn rounded-xl flex items-center justify-center text-xl sm:text-2xl text-rose-200 font-bold">
                    2P ◀
                </button>
                <button id="btnP2Right" class="touch-pad-btn rounded-xl flex items-center justify-center text-xl sm:text-2xl text-rose-200 font-bold">
                    2P ▶
                </button>
            </div>
        </div>
    </footer>

    <script>
        /**
         * ============================================================================
         * 게임 기획: 정현서
         * 게임 제목: 운석이 떨어진다!!!!
         * 구현 설명:
         * - 기획서에 명시된 3가지 캐릭터('운석', '사람', '다른 사람')를 캔버스 벡터 그래픽으로 귀엽고 개성 있게 구현
         * - 일반 모드(1인) 및 대전 모드(2인 동시 생존 대결) 완벽 지원
         * - Web Audio API를 이용한 외부 파일 없는 레트로 효과음 내장
         * ============================================================================
         */

        // --- 1. 사운드 매니저 (Web Audio API 레트로 효과음) ---
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, vol = 0.15, slideTo = null) {
                if (this.muted) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    if (slideTo) {
                        osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
                    }
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    // 오디오 컨텍스트 제한 예외 무시
                }
            }

            playSelect() {
                this.playTone(520, 'sine', 0.08, 0.12, 780);
            }

            playStart() {
                this.playTone(330, 'square', 0.1, 0.12);
                setTimeout(() => this.playTone(440, 'square', 0.1, 0.12), 90);
                setTimeout(() => this.playTone(660, 'square', 0.2, 0.15), 180);
            }

            playScore() {
                // 별을 피해서 점수가 올라갈 때 경쾌한 맑은 소리
                this.playTone(880, 'sine', 0.09, 0.08, 1174);
            }

            playCrash() {
                // 충돌 폭발음
                this.playTone(160, 'sawtooth', 0.35, 0.25, 35);
                this.playTone(110, 'square', 0.3, 0.2, 30);
            }

            playWin() {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((n, i) => {
                    setTimeout(() => this.playTone(n, 'triangle', 0.18, 0.18), i * 100);
                });
            }
        }

        const sound = new SoundManager();

        function toggleMute() {
            sound.muted = !sound.muted;
            document.getElementById('muteBtn').textContent = sound.muted ? '🔇' : '🔊';
        }

        // --- 2. 게임 상태 및 캐릭터 정의 ---
        const CHARACTERS = [
            {
                id: 'meteor',
                name: '운석',
                desc: '불타는 우주 바위!',
                badge: '인기',
                color: '#f97316'
            },
            {
                id: 'person',
                name: '사람',
                desc: '날렵한 지구인 소년',
                badge: '기본',
                color: '#38bdf8'
            },
            {
                id: 'other_person',
                name: '다른 사람',
                desc: '선글라스 쓴 멋쟁이!',
                badge: '개성',
                color: '#a855f7'
            }
        ];

        const gameState = {
            screen: 'menu', // 'menu', 'playing', 'gameover'
            mode: 'single', // 'single', 'versus'
            p1Char: 'meteor',
            p2Char: 'person',
            score: 0,
            bestScore: parseInt(localStorage.getItem('meteor_dodge_best') || '0', 10),
            difficulty: 1,
            shakeTime: 0,
            frameCount: 0
        };

        // --- 3. 캐릭터 선택 UI 렌더링 ---
        function renderCharacterCards() {
            const p1Grid = document.getElementById('p1CharGrid');
            const p2Grid = document.getElementById('p2CharGrid');

            p1Grid.innerHTML = '';
            p2Grid.innerHTML = '';

            CHARACTERS.forEach(char => {
                // 1P 카드 생성
                const isP1Sel = gameState.p1Char === char.id;
                const card1 = document.createElement('button');
                card1.type = 'button';
                card1.onclick = () => {
                    gameState.p1Char = char.id;
                    sound.playSelect();
                    renderCharacterCards();
                };
                card1.className = `char-card bg-slate-900/90 rounded-2xl p-2.5 sm:p-3 flex flex-col items-center text-center cursor-pointer ${isP1Sel ? 'selected-p1' : 'border-slate-700 hover:bg-slate-800'}`;
                card1.innerHTML = `
                    <canvas width="64" height="64" class="char-preview w-12 h-12 sm:w-16 sm:h-16 mb-1" data-char="${char.id}" data-player="1"></canvas>
                    <span class="text-base sm:text-lg font-bold text-white leading-tight">${char.name}</span>
                    <span class="text-[11px] sm:text-xs text-slate-400 mt-0.5 line-clamp-1">${char.desc}</span>
                `;
                p1Grid.appendChild(card1);

                // 2P 카드 생성
                const isP2Sel = gameState.p2Char === char.id;
                const card2 = document.createElement('button');
                card2.type = 'button';
                card2.onclick = () => {
                    gameState.p2Char = char.id;
                    sound.playSelect();
                    renderCharacterCards();
                };
                card2.className = `char-card bg-slate-900/90 rounded-2xl p-2.5 sm:p-3 flex flex-col items-center text-center cursor-pointer ${isP2Sel ? 'selected-p2' : 'border-slate-700 hover:bg-slate-800'}`;
                card2.innerHTML = `
                    <canvas width="64" height="64" class="char-preview w-12 h-12 sm:w-16 sm:h-16 mb-1" data-char="${char.id}" data-player="2"></canvas>
                    <span class="text-base sm:text-lg font-bold text-white leading-tight">${char.name}</span>
                    <span class="text-[11px] sm:text-xs text-slate-400 mt-0.5 line-clamp-1">${char.desc}</span>
                `;
                p2Grid.appendChild(card2);
            });

            // 미니 캔버스에 캐릭터 미리보기 그리기
            document.querySelectorAll('.char-preview').forEach(cvs => {
                const ctx = cvs.getContext('2d');
                const charId = cvs.dataset.char;
                const playerNum = parseInt(cvs.dataset.player, 10);
                drawCharacterSprite(ctx, charId, 32, 34, 44, 0, playerNum);
            });
        }

        function selectMode(mode) {
            gameState.mode = mode;
            sound.playSelect();

            const singleBtn = document.getElementById('modeSingleBtn');
            const versusBtn = document.getElementById('modeVersusBtn');
            const p2Section = document.getElementById('p2SelectSection');
            const p1Label = document.getElementById('p1SelectLabel');

                versusBtn.className = 'arcade-btn py-2.5 px-3 rounded-xl text-base sm:text-lg font-bold flex items-center justify-center gap-2 bg-slate-800 text-slate-300 hover:bg-slate-700';
                p2Section.classList.add('hidden');
                p1Label.innerHTML = `<span class="bg-sky-500 text-slate-950 text-xs px-2 py-0.5 rounded-md">내 캐릭터</span> 고르기`;
            } else {
                versusBtn.className = 'arcade-btn py-2.5 px-3 rounded-xl text-base sm:text-lg font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-rose-500 to-pink-600 text-white';
                singleBtn.className = 'arcade-btn py-2.5 px-3 rounded-xl text-base sm:text-lg font-bold flex items-center justify-center gap-2 bg-slate-800 text-slate-300 hover:bg-slate-700';
                p2Section.classList.remove('hidden');
                p1Label.innerHTML = `<span class="bg-sky-500 text-slate-950 text-xs px-2 py-0.5 rounded-md">1P</span> 캐릭터 선택`;

        }

        // --- 4. 캐릭터 & 별(운석) 아트워크 렌더링 함수 ---
        function drawCharacterSprite(ctx, charId, x, y, size, tilt = 0, playerNum = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(tilt);

            const r = size / 2;

            if (charId === 'meteor') {
                // [캐릭터 1: 운석] 불꽃 아우라 + 크레이터가 있는 귀여운 바위 운석
                const flameGrad = ctx.createRadialGradient(0, -4, r * 0.3, 0, -4, r * 1.35);
                flameGrad.addColorStop(0, '#fef08a');
                flameGrad.addColorStop(0.5, '#f97316');
                flameGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
                ctx.fillStyle = flameGrad;
                ctx.beginPath();
                ctx.arc(0, -3, r * 1.3, 0, Math.PI * 2);
                ctx.fill();

                // 바위 몸체 (울퉁불퉁 다각형 느낌의 원)
                ctx.fillStyle = '#78350f';
                ctx.strokeStyle = '#fb923c';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                const points = 10;
                for (let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 2;
                    const radOffset = (i % 2 === 0) ? r * 0.95 : r * 0.82;
                    const px = Math.cos(angle) * radOffset;
                    const py = Math.sin(angle) * radOffset;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 크레이터 무늬
                ctx.fillStyle = '#451a03';
                ctx.beginPath();
                ctx.arc(-r * 0.45, -r * 0.3, r * 0.18, 0, Math.PI * 2);
                ctx.arc(r * 0.48, r * 0.25, r * 0.15, 0, Math.PI * 2);
                ctx.fill();

                // 귀여운 비장한 눈썹과 눈
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-r * 0.28, -r * 0.05, r * 0.2, 0, Math.PI * 2);
                ctx.arc(r * 0.28, -r * 0.05, r * 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(-r * 0.25, -r * 0.05, r * 0.1, 0, Math.PI * 2);
                ctx.arc(r * 0.25, -r * 0.05, r * 0.1, 0, Math.PI * 2);
                ctx.fill();

                // 열정적인 눈썹
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(-r * 0.48, -r * 0.28);
                ctx.lineTo(-r * 0.1, -r * 0.18);
                ctx.moveTo(r * 0.48, -r * 0.28);
                ctx.lineTo(r * 0.1, -r * 0.18);
                ctx.stroke();

                // 입
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(0, r * 0.28, r * 0.18, 0, Math.PI);
                ctx.fill();

            } else if (charId === 'person') {
                // [캐릭터 2: 사람] 밝은 표정의 어린이/학생 캐릭터
                // 몸통 (파란 티셔츠)
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.roundRect(-r * 0.55, r * 0.15, r * 1.1, r * 0.75, 8);
                ctx.fill();

                // 다리
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(-r * 0.4, r * 0.8, r * 0.3, r * 0.25);
                ctx.fillRect(r * 0.1, r * 0.8, r * 0.3, r * 0.25);

                // 얼굴
                ctx.fillStyle = '#fed7aa';
                ctx.beginPath();
                ctx.arc(0, -r * 0.2, r * 0.58, 0, Math.PI * 2);
                ctx.fill();

                // 머리카락 (갈색 바가지 머리)
                ctx.fillStyle = '#451a03';
                ctx.beginPath();
                ctx.arc(0, -r * 0.28, r * 0.6, Math.PI, Math.PI * 2);
                ctx.fill();

                // 초롱초롱한 눈
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(-r * 0.22, -r * 0.18, r * 0.08, 0, Math.PI * 2);
                ctx.arc(r * 0.22, -r * 0.18, r * 0.08, 0, Math.PI * 2);
                ctx.fill();

                // 발그레한 볼
                ctx.fillStyle = 'rgba(244, 63, 94, 0.45)';
                ctx.beginPath();
                ctx.arc(-r * 0.35, -r * 0.05, r * 0.1, 0, Math.PI * 2);
                ctx.arc(r * 0.35, -r * 0.05, r * 0.1, 0, Math.PI * 2);
                ctx.fill();

                // 웃는 입
                ctx.strokeStyle = '#9a3412';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -r * 0.05, r * 0.16, 0.1 * Math.PI, 0.9 * Math.PI);
                ctx.stroke();

            } else if (charId === 'other_person') {
                // [캐릭터 3: 다른 사람] 모자와 선글라스를 쓴 힙한 다른 사람!
                // 몸통 (보라색 후드티)
                ctx.fillStyle = '#a855f7';
                ctx.beginPath();
                ctx.roundRect(-r * 0.58, r * 0.15, r * 1.16, r * 0.75, 8);
                ctx.fill();

                // 후드티 줄무늬 포인트
                ctx.fillStyle = '#facc15';
                ctx.fillRect(-r * 0.58, r * 0.42, r * 1.16, r * 0.14);

                // 다리
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-r * 0.4, r * 0.8, r * 0.3, r * 0.25);
                ctx.fillRect(r * 0.1, r * 0.8, r * 0.3, r * 0.25);

                // 얼굴
                ctx.fillStyle = '#ffedd5';
                ctx.beginPath();
                ctx.arc(0, -r * 0.2, r * 0.58, 0, Math.PI * 2);
                ctx.fill();

                // 빨간 야구모자
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(0, -r * 0.32, r * 0.6, Math.PI, Math.PI * 2);
                ctx.fill();
                // 모자 챙
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.roundRect(-r * 0.5, -r * 0.38, r * 1.15, r * 0.14, 4);
                ctx.fill();

                // 멋쟁이 검은 선글라스
                ctx.fillStyle = '#090d16';
                ctx.beginPath();
                ctx.roundRect(-r * 0.46, -r * 0.24, r * 0.4, r * 0.22, 4);
                ctx.roundRect(r * 0.06, -r * 0.24, r * 0.4, r * 0.22, 4);
                ctx.fill();
                // 선글라스 브릿지 & 반사광
                ctx.strokeStyle = '#090d16';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(-r * 0.06, -r * 0.16);
                ctx.lineTo(r * 0.06, -r * 0.16);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-r * 0.38, -r * 0.2);
                ctx.lineTo(-r * 0.25, -r * 0.08);
                ctx.moveTo(r * 0.14, -r * 0.2);
                ctx.lineTo(r * 0.27, -r * 0.08);
                ctx.stroke();

                // 씨익 웃는 입
                ctx.strokeStyle = '#7c2d12';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-r * 0.15, r * 0.06);
                ctx.quadraticCurveTo(0, r * 0.14, r * 0.2, r * 0.02);
                ctx.stroke();
            }

            ctx.restore();
        }

        // 떨어지는 장애물: 반짝이는 별(별똥별) 그리기
        function drawFallingStar(ctx, star) {
            ctx.save();
            ctx.translate(star.x, star.y);

            // 별똥별 꼬리 불꽃
            const tailGrad = ctx.createLinearGradient(0, -star.radius * 2.8, 0, star.radius * 0.5);
            tailGrad.addColorStop(0, 'rgba(253, 224, 71, 0)');
            tailGrad.addColorStop(0.6, 'rgba(251, 146, 60, 0.5)');
            tailGrad.addColorStop(1, 'rgba(254, 240, 138, 0.9)');
            ctx.fillStyle = tailGrad;
            ctx.beginPath();
            ctx.moveTo(-star.radius * 0.7, 0);
            ctx.lineTo(0, -star.radius * 2.8);
            ctx.lineTo(star.radius * 0.7, 0);
            ctx.closePath();
            ctx.fill();

            // 회전하는 5각 별 본체
            ctx.rotate(star.rotation);
            ctx.fillStyle = star.color;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#fde047';
            ctx.shadowBlur = 12;

            const spikes = 5;
            const outerRadius = star.radius;
            const innerRadius = star.radius * 0.48;
            let rot = (Math.PI / 2) * 3;
            const step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(0, -outerRadius);
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(Math.cos(rot) * outerRadius, Math.sin(rot) * outerRadius);
                rot += step;
                ctx.lineTo(Math.cos(rot) * innerRadius, Math.sin(rot) * innerRadius);
                rot += step;
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 별 중앙에 귀여운 표정 (장난꾸러기 별)
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#713f12';
            ctx.beginPath();
            ctx.arc(-star.radius * 0.18, -star.radius * 0.05, star.radius * 0.09, 0, Math.PI * 2);
            ctx.arc(star.radius * 0.18, -star.radius * 0.05, star.radius * 0.09, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // --- 5. 게임 엔진 변수 및 초기화 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let players = [];
        let fallingStars = [];
        let particles = [];
        let bgStars = [];
        let spawnTimer = 0;

        // 입력 상태 관리
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            KeyA: false,
            KeyD: false,
            p1Left: false,
            p1Right: false,
            p2Left: false,
            p2Right: false
        };

        // 캔버스 반응형 리사이즈
        function resizeCanvas() {
            const wrapper = document.getElementById('canvasWrapper');
            if (!wrapper) return;
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;

            // 배경 반짝이 별 재생성
            bgStars = [];
            const count = Math.floor((canvas.width * canvas.height) / 8000);
            for (let i = 0; i < count; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.8,
                    twinkleSpeed: Math.random() * 0.05 + 0.01,
                    phase: Math.random() * Math.PI * 2
                });
            }

            // 플레이어가 화면 밖으로 나가지 않도록 보정
            players.forEach(p => {
                p.y = canvas.height - 46;
                p.x = Math.max(p.radius, Math.min(canvas.width - p.radius, p.x));
            });
        }

        window.addEventListener('resize', resizeCanvas);

        // 키보드 이벤트 리스너
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'KeyA') keys.KeyA = true;
            if (e.code === 'KeyD') keys.KeyD = true;

            // 엔터나 스페이스바로 빠른 재시작
            if (gameState.screen === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) {
                e.preventDefault();
                startGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'KeyA') keys.KeyA = false;
            if (e.code === 'KeyD') keys.KeyD = false;
        });

        // 모바일/태블릿 터치 패드 바인딩
        function bindTouchControl(btnId, keyName) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            const start = (e) => {
                e.preventDefault();
                keys[keyName] = true;
                btn.classList.add('active');
            };
            const end = (e) => {
                e.preventDefault();
                keys[keyName] = false;
                btn.classList.remove('active');
            };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('touchcancel', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }

        bindTouchControl('btnSingleLeft', 'p1Left');
        bindTouchControl('btnSingleRight', 'p1Right');
        bindTouchControl('btnP1Left', 'p1Left');
        bindTouchControl('btnP1Right', 'p1Right');
        bindTouchControl('btnP2Left', 'p2Left');
        bindTouchControl('btnP2Right', 'p2Right');

        // --- 6. 게임 시작 및 화면 전환 로직 ---
        function goToMenu() {
            gameState.screen = 'menu';
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hudScoreBoard').classList.add('hidden');
            document.getElementById('homeBtn').classList.add('hidden');
            document.getElementById('touchControls').classList.add('hidden');
            resizeCanvas();
        }

        function startGame() {
            sound.init();
            sound.playStart();

            gameState.screen = 'playing';
            gameState.score = 0;
            gameState.difficulty = 1;
            gameState.shakeTime = 0;
            gameState.frameCount = 0;

            fallingStars = [];
            particles = [];
            spawnTimer = 0;

            // UI 전환
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hudScoreBoard').classList.remove('hidden');
            document.getElementById('homeBtn').classList.remove('hidden');
            document.getElementById('touchControls').classList.remove('hidden');

            resizeCanvas();

            const pRadius = Math.max(20, Math.min(26, canvas.width * 0.035));
            const baseSpeed = Math.max(5.5, canvas.width * 0.0085);

            if (gameState.mode === 'single') {
                document.getElementById('singleScoreHud').classList.remove('hidden');
                document.getElementById('versusScoreHud').classList.add('hidden');
                document.getElementById('singleTouchPad').classList.remove('hidden');
                document.getElementById('versusTouchPad').classList.add('hidden');

                document.getElementById('currentScoreText').textContent = '0';
                document.getElementById('bestScoreText').textContent = gameState.bestScore;

                players = [
                    {
                        id: 1,
                        label: '1P',
                        charId: gameState.p1Char,
                        x: canvas.width / 2,
                        y: canvas.height - 46,
                        radius: pRadius,
                        speed: baseSpeed,
                        tilt: 0,
                        alive: true,
                        badgeColor: '#38bdf8'
                    }
                ];
            } else {
                document.getElementById('singleScoreHud').classList.add('hidden');
                document.getElementById('versusScoreHud').classList.remove('hidden');
                document.getElementById('singleTouchPad').classList.add('hidden');
                document.getElementById('versusTouchPad').classList.remove('hidden');

                document.getElementById('p1StatusText').textContent = '생존!';
                document.getElementById('p1StatusText').className = 'text-sm sm:text-base text-sky-300 font-bold';
                document.getElementById('p2StatusText').textContent = '생존!';
                document.getElementById('p2StatusText').className = 'text-sm sm:text-base text-rose-300 font-bold';
                document.getElementById('versusScoreText').textContent = '0';

                players = [
                    {
                        id: 1,
                        label: '1P',
                        charId: gameState.p1Char,
                        x: canvas.width * 0.3,
                        y: canvas.height - 46,
                        radius: pRadius,
                        speed: baseSpeed,
                        tilt: 0,
                        alive: true,
                        badgeColor: '#38bdf8'
                    },
                    {
                        id: 2,
                        label: '2P',
                        charId: gameState.p2Char,
                        x: canvas.width * 0.7,
                        y: canvas.height - 46,
                        radius: pRadius,
                        speed: baseSpeed,
                        tilt: 0,
                        alive: true,
                        badgeColor: '#fb7185'
                    }
                ];
            }
        }

        // 폭발 파티클 생성
        function createExplosion(x, y, color) {
            for (let i = 0; i < 28; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 5 + 2,
                    color: i % 2 === 0 ? color : '#fef08a',
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        // 게임 오버 처리
        function triggerGameOver(winnerPlayer = null) {
            gameState.screen = 'gameover';
            document.getElementById('touchControls').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');

            if (gameState.mode === 'single') {
                sound.playCrash();
                if (gameState.score > gameState.bestScore) {
                    gameState.bestScore = gameState.score;
                    localStorage.setItem('meteor_dodge_best', gameState.bestScore.toString());
                    document.getElementById('resultBadge').textContent = '🏆 와우! 최고 기록 경신!';
                    document.getElementById('resultBadge').className = 'inline-block bg-yellow-400/20 border border-yellow-400 text-yellow-300 px-4 py-1 rounded-full text-sm mb-2';
                } else {
                    document.getElementById('resultBadge').textContent = '💥 별에 부딪혔어요!';
                    document.getElementById('resultBadge').className = 'inline-block bg-red-500/20 border border-red-400 text-red-300 px-4 py-1 rounded-full text-sm mb-2';
                }

                document.getElementById('resultTitle').textContent = '게임 오버!';
                document.getElementById('singleResultBox').classList.remove('hidden');
                document.getElementById('versusResultBox').classList.add('hidden');

                document.getElementById('finalScoreText').textContent = gameState.score + '점';
                document.getElementById('finalBestText').textContent = gameState.bestScore + '점';
            } else {
                sound.playWin();
                document.getElementById('singleResultBox').classList.add('hidden');
                document.getElementById('versusResultBox').classList.remove('hidden');

                document.getElementById('resultBadge').textContent = '⚔️ 2인 대전 종료!';
                document.getElementById('resultBadge').className = 'inline-block bg-indigo-500/20 border border-indigo-400 text-indigo-300 px-4 py-1 rounded-full text-sm mb-2';

                if (winnerPlayer) {
                    const charObj = CHARACTERS.find(c => c.id === winnerPlayer.charId);
                    document.getElementById('resultTitle').textContent = `${winnerPlayer.label} 승리!`;
                    document.getElementById('winnerAnnouncement').textContent = `🎉 ${winnerPlayer.label} (${charObj.name}) 우승!`;
                    document.getElementById('winnerAnnouncement').className = winnerPlayer.id === 1
                        ? 'text-2xl sm:text-3xl font-bold text-sky-400 mb-1'
                        : 'text-2xl sm:text-3xl font-bold text-rose-400 mb-1';
                } else {
                    document.getElementById('resultTitle').textContent = '무승부!';
                    document.getElementById('winnerAnnouncement').textContent = '😲 동시에 별에 맞았어요!';
                    document.getElementById('winnerAnnouncement').className = 'text-2xl sm:text-3xl font-bold text-yellow-300 mb-1';
                }
                document.getElementById('versusSurviveDetail').textContent = `함께 피한 별: 총 ${gameState.score}개`;
            }
        }

        // --- 7. 메인 업데이트 및 렌더링 루프 ---
        function update() {
            gameState.frameCount++;

            if (gameState.shakeTime > 0) {
                gameState.shakeTime--;
            }

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.vy += 0.15; // 약한 중력
                pt.alpha -= pt.decay;
                if (pt.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (gameState.screen !== 'playing') return;

            // 난이도 점진적 상승 (점수가 높을수록 별이 더 자주, 빠르게 떨어짐)
            gameState.difficulty = 1 + Math.floor(gameState.score / 10) * 0.18;

            // 플레이어 이동 처리
            players.forEach(p => {
                if (!p.alive) return;

                let moveDir = 0;
                if (gameState.mode === 'single') {
                    if (keys.ArrowLeft || keys.KeyA || keys.p1Left) moveDir -= 1;
                    if (keys.ArrowRight || keys.KeyD || keys.p1Right) moveDir += 1;
                } else {
                    // 대전 모드: 1P는 A/D 또는 1P 터치버튼, 2P는 좌/우 화살표 또는 2P 터치버튼
                    if (p.id === 1) {
                        if (keys.KeyA || keys.p1Left) moveDir -= 1;
                        if (keys.KeyD || keys.p1Right) moveDir += 1;
                    } else if (p.id === 2) {
                        if (keys.ArrowLeft || keys.p2Left) moveDir -= 1;
                        if (keys.ArrowRight || keys.p2Right) moveDir += 1;
                    }
                }

                p.x += moveDir * p.speed;
                // 이동 방향에 따라 캐릭터가 귀엽게 기울어짐
                const targetTilt = moveDir * 0.22;
                p.tilt += (targetTilt - p.tilt) * 0.25;

                // 좌우 벽 경계 제한
                if (p.x < p.radius + 6) p.x = p.radius + 6;
                if (p.x > canvas.width - p.radius - 6) p.x = canvas.width - p.radius - 6;
            });

            // 떨어지는 별(장애물) 스폰
            const spawnInterval = Math.max(11, Math.floor(32 / gameState.difficulty));
            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;
                const radius = Math.random() * 8 + 14;
                const starColors = ['#fde047', '#facc15', '#fb923c', '#38bdf8', '#f472b6'];
                fallingStars.push({
                    x: Math.random() * (canvas.width - radius * 2) + radius,
                    y: -radius * 2,
                    radius: radius,
                    vy: (Math.random() * 2.5 + 3.8) * Math.min(2.3, gameState.difficulty),
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.12,
                    color: starColors[Math.floor(Math.random() * starColors.length)]
                });
            }

            // 별 이동 및 충돌 / 점수 획득 판정
            for (let i = fallingStars.length - 1; i >= 0; i--) {
                const star = fallingStars[i];
                star.y += star.vy;
                star.rotation += star.rotSpeed;

                let hitAny = false;

                // 살아있는 플레이어와 충돌 검사 (원형 히트박스, 공정성을 위해 82% 너그러운 판정)
                players.forEach(p => {
                    if (!p.alive) return;
                    const dx = p.x - star.x;
                    const dy = p.y - star.y;
                    const dist = Math.hypot(dx, dy);
                    const hitDist = (p.radius + star.radius) * 0.8;

                    if (dist < hitDist) {
                        p.alive = false;
                        hitAny = true;
                        gameState.shakeTime = 16;
                        createExplosion(p.x, p.y, p.badgeColor);
                        sound.playCrash();

                        if (gameState.mode === 'versus') {
                            const statusEl = document.getElementById(p.id === 1 ? 'p1StatusText' : 'p2StatusText');
                            statusEl.textContent = '탈락! 💥';
                            statusEl.className = 'text-sm sm:text-base text-slate-500 line-through';
                        }
                    }
                });

                if (hitAny) {
                    fallingStars.splice(i, 1);

                    // 모드별 종료 조건 확인
                    if (gameState.mode === 'single') {
                        triggerGameOver();
                        return;
                    } else {
                        const alivePlayers = players.filter(p => p.alive);
                        if (alivePlayers.length <= 1) {
                            triggerGameOver(alivePlayers[0] || null);
                            return;
                        }
                    }
                    continue;
                }

                // 바닥까지 무사히 떨어져 피한 경우 -> 점수 +1!
                if (star.y - star.radius > canvas.height) {
                    fallingStars.splice(i, 1);
                    gameState.score += 1;

                    if (gameState.mode === 'single') {
                        document.getElementById('currentScoreText').textContent = gameState.score;
                        if (gameState.score > gameState.bestScore) {
                            document.getElementById('bestScoreText').textContent = gameState.score;
                        }
                    } else {
                        document.getElementById('versusScoreText').textContent = gameState.score;
                    }

                    if (gameState.score % 5 === 0) {
                        sound.playScore();
                    }
                }
            }
        }

        function draw() {
            ctx.save();

            // 충돌 시 화면 흔들림 효과
            if (gameState.shakeTime > 0) {
                const mag = gameState.shakeTime * 0.6;
                const sx = (Math.random() - 0.5) * mag;
                const sy = (Math.random() - 0.5) * mag;
                ctx.translate(sx, sy);
            }

            // 1. 밤하늘 우주 배경
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#090d16');
            skyGrad.addColorStop(0.6, '#171c3a');
            skyGrad.addColorStop(1, '#261e47');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 반짝이는 배경 별들
            bgStars.forEach(s => {
                const alpha = 0.3 + 0.7 * Math.abs(Math.sin(gameState.frameCount * s.twinkleSpeed + s.phase));
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 바닥 행성 지면 라인
            const groundY = canvas.height - 18;
            ctx.fillStyle = '#312e81';
            ctx.fillRect(0, groundY, canvas.width, 18);
            ctx.fillStyle = '#6366f1';
            ctx.fillRect(0, groundY, canvas.width, 3);

            // 2. 떨어지는 별(장애물) 그리기
            fallingStars.forEach(star => {
                drawFallingStar(ctx, star);
            });

            // 3. 플레이어 캐릭터 그리기
            players.forEach(p => {
                if (!p.alive) return;

                // 바닥 그림자
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.beginPath();
                ctx.ellipse(p.x, groundY + 2, p.radius * 0.85, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                // 캐릭터 본체
                drawCharacterSprite(ctx, p.charId, p.x, p.y, p.radius * 2, p.tilt, p.id);

                // 2인 대전 모드일 때는 머리 위에 1P / 2P 이름표 표시
                if (gameState.mode === 'versus') {
                    ctx.font = 'bold 13px Jua, sans-serif';
                    ctx.textAlign = 'center';
                    const tagW = 30;
                    const tagH = 18;
                    const tagY = p.y - p.radius - 22;

                    ctx.fillStyle = p.badgeColor;
                    ctx.beginPath();
                    ctx.roundRect(p.x - tagW / 2, tagY, tagW, tagH, 6);
                    ctx.fill();

                    ctx.fillStyle = '#090d16';
                    ctx.fillText(p.label, p.x, tagY + 13);
                }
            });

            // 4. 폭발 파티클 그리기
            particles.forEach(pt => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, pt.alpha);
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 초기 실행
        window.onload = function () {
            renderCharacterCards();
            selectMode('single');
            resizeCanvas();
            gameLoop();
        };
    </script>
</body>
